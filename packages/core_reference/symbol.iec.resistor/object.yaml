ai_context:
  definition: >-
    The IEC Resistor Symbol is the standardized rectangular schematic
    glyph used to depict a fixed resistor in IEC-convention diagrams.
  engineering_explanation: >-
    A schematic symbol is purely a visual/notational convention -- it
    carries no calculation, simulation, or validation behavior of its
    own. The Resistor component it represents owns all engineering
    behavior; the symbol only owns how that component is drawn.
  common_mistakes:
    - Mixing IEC (rectangle) and ANSI (zig-zag) resistor symbols within
      the same diagram set.
  design_considerations:
    - Confirm the target audience/standard (IEC vs. ANSI) before
      choosing a symbol convention for a diagram set.
  troubleshooting: []
  frequently_asked_questions:
    - question: Why is the resistor symbol a rectangle instead of a zig-zag?
      answer: >-
        IEC 60617 uses a plain rectangle for a fixed resistor; the
        zig-zag symbol is the ANSI/IEEE convention for the same
        component, a separate Symbol EKO.

