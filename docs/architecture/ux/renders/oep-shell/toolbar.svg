<svg width="1920" height="60" viewBox="0 0 1920 60" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, -apple-system, sans-serif">
  <!-- OEP Toolbar / Action Strip (region 07) — canonical, 1920x60 — AP-UX-005 -->
  <!-- Follows the approved reference exactly: renders/.../toolbar 7 use option 3.png, "GROUPED SECTIONS" option. -->
  <!-- Monochrome: all icons/text/borders use oep.text.secondary + oep.accent only — never a per-Studio identity color -->
  <!-- (OEP-SHELL-COMPONENTS.md §6, OEP-DESIGN-TOKENS.md §2A, confirmed by this reference render's own selection). -->
  <rect x="0" y="0" width="1920" height="60" fill="#111720"/>
  <rect x="0" y="0" width="1920" height="1" fill="#2A3542"/>
  <rect x="0" y="59" width="1920" height="1" fill="#2A3542"/>

  <!-- FILE -->
  <text x="20" y="13" fill="#667585" font-size="9" font-weight="700" letter-spacing="1">FILE</text>
  <g font-size="12" fill="#9AA8B7">
    <rect x="20" y="20" width="58" height="28" rx="3" fill="none" stroke="#2A3542" stroke-width="1"/>
    <rect x="30" y="28" width="10" height="13" fill="none" stroke="#9AA8B7" stroke-width="1.2"/>
    <text x="46" y="38">New</text>
    <rect x="86" y="20" width="66" height="28" rx="3" fill="none" stroke="#2A3542" stroke-width="1"/>
    <path d="M96,32 h10 v9 h-10 z M96,32 l5,-4 l5,4" fill="none" stroke="#9AA8B7" stroke-width="1.2"/>
    <text x="112" y="38">Open</text>
    <rect x="160" y="20" width="62" height="28" rx="3" fill="none" stroke="#2A3542" stroke-width="1"/>
    <rect x="170" y="28" width="10" height="13" rx="1" fill="none" stroke="#9AA8B7" stroke-width="1.2"/>
    <text x="186" y="38">Save</text>
  </g>
  <line x1="238" y1="14" x2="238" y2="48" stroke="#2A3542" stroke-width="1"/>

  <!-- EDIT -->
  <text x="256" y="13" fill="#667585" font-size="9" font-weight="700" letter-spacing="1">EDIT</text>
  <g font-size="12" fill="#9AA8B7">
    <rect x="256" y="20" width="74" height="28" rx="3" fill="none" stroke="#2A3542" stroke-width="1"/>
    <path d="M266,33 a7,7 0 1 1 2,5" fill="none" stroke="#9AA8B7" stroke-width="1.2"/>
    <path d="M266,28 v6 h6" fill="none" stroke="#9AA8B7" stroke-width="1.2"/>
    <text x="282" y="38">Undo</text>
    <rect x="338" y="20" width="74" height="28" rx="3" fill="none" stroke="#2A3542" stroke-width="1"/>
    <path d="M356,33 a7,7 0 1 0 -2,5" fill="none" stroke="#9AA8B7" stroke-width="1.2"/>
    <path d="M356,28 v6 h-6" fill="none" stroke="#9AA8B7" stroke-width="1.2"/>
    <text x="364" y="38">Redo</text>
  </g>
  <line x1="428" y1="14" x2="428" y2="48" stroke="#2A3542" stroke-width="1"/>

  <!-- VIEW -->
  <text x="446" y="13" fill="#667585" font-size="9" font-weight="700" letter-spacing="1">VIEW</text>
  <g font-size="12" fill="#9AA8B7">
    <rect x="446" y="20" width="40" height="28" rx="3" fill="none" stroke="#2A3542" stroke-width="1"/>
    <circle cx="461" cy="33" r="6" fill="none" stroke="#9AA8B7" stroke-width="1.2"/>
    <line x1="465" y1="37" x2="470" y2="42" stroke="#9AA8B7" stroke-width="1.2"/>
    <line x1="461" y1="30" x2="461" y2="36" stroke="#9AA8B7" stroke-width="1"/>
    <line x1="458" y1="33" x2="464" y2="33" stroke="#9AA8B7" stroke-width="1"/>
    <rect x="494" y="20" width="40" height="28" rx="3" fill="none" stroke="#2A3542" stroke-width="1"/>
    <circle cx="509" cy="33" r="6" fill="none" stroke="#9AA8B7" stroke-width="1.2"/>
    <line x1="513" y1="37" x2="518" y2="42" stroke="#9AA8B7" stroke-width="1.2"/>
    <line x1="506" y1="33" x2="512" y2="33" stroke="#9AA8B7" stroke-width="1"/>
    <rect x="542" y="20" width="52" height="28" rx="3" fill="none" stroke="#2A3542" stroke-width="1"/>
    <path d="M552,30 h-4 v6 M584,30 h4 v6 M552,42 h-4 v-6 M584,42 h4 v-6" fill="none" stroke="#9AA8B7" stroke-width="1.2"/>
    <text x="562" y="38">Fit</text>
  </g>
  <line x1="610" y1="14" x2="610" y2="48" stroke="#2A3542" stroke-width="1"/>

  <!-- TOOLS -->
  <text x="628" y="13" fill="#667585" font-size="9" font-weight="700" letter-spacing="1">TOOLS</text>
  <g font-size="12" fill="#9AA8B7">
    <rect x="628" y="20" width="104" height="28" rx="3" fill="none" stroke="#2A3542" stroke-width="1"/>
    <path d="M640,34 l5,5 l9,-11" fill="none" stroke="#39B56B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="660" y="38">Validate</text>
    <path d="M718,31 l5,5 l-5,5" fill="none" stroke="#9AA8B7" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <line x1="746" y1="14" x2="746" y2="48" stroke="#2A3542" stroke-width="1"/>

  <!-- SIMULATION -->
  <text x="764" y="13" fill="#667585" font-size="9" font-weight="700" letter-spacing="1">SIMULATION</text>
  <g font-size="12" fill="#9AA8B7">
    <rect x="764" y="20" width="84" height="28" rx="3" fill="none" stroke="#2A3542" stroke-width="1"/>
    <path d="M776,28 l10,8 l-10,8 z" fill="#2F81F7"/>
    <text x="796" y="38">Run</text>
    <path d="M828,31 l5,5 l-5,5" fill="none" stroke="#9AA8B7" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <line x1="866" y1="14" x2="866" y2="48" stroke="#2A3542" stroke-width="1"/>

  <!-- DIAGRAM -->
  <text x="884" y="13" fill="#667585" font-size="9" font-weight="700" letter-spacing="1">DIAGRAM</text>
  <g font-size="12" fill="#9AA8B7">
    <rect x="884" y="20" width="58" height="28" rx="3" fill="none" stroke="#2A3542" stroke-width="1"/>
    <g fill="#9AA8B7"><circle cx="895" cy="30" r="1.3"/><circle cx="901" cy="30" r="1.3"/><circle cx="907" cy="30" r="1.3"/><circle cx="895" cy="36" r="1.3"/><circle cx="901" cy="36" r="1.3"/><circle cx="907" cy="36" r="1.3"/></g>
    <text x="916" y="38">Grid</text>
    <rect x="950" y="20" width="70" height="28" rx="3" fill="none" stroke="#2A3542" stroke-width="1"/>
    <path d="M960,28 h10 v13 h-10 z M962,28 v4 M966,28 v4 M970,28 v4" fill="none" stroke="#9AA8B7" stroke-width="1"/>
    <text x="978" y="38">Ruler</text>
    <rect x="1028" y="20" width="76" height="28" rx="3" fill="none" stroke="#2A3542" stroke-width="1"/>
    <path d="M1039,28 l8,4 l-8,4 l-8,-4 z M1039,36 l8,4 l-8,4 l-8,-4 z" fill="none" stroke="#9AA8B7" stroke-width="1.1"/>
    <text x="1058" y="38">Layers</text>
  </g>
  <line x1="1112" y1="14" x2="1112" y2="48" stroke="#2A3542" stroke-width="1"/>

  <!-- MORE -->
  <text x="1130" y="13" fill="#667585" font-size="9" font-weight="700" letter-spacing="1">MORE</text>
  <g font-size="12" fill="#9AA8B7">
    <rect x="1130" y="20" width="46" height="28" rx="3" fill="none" stroke="#2A3542" stroke-width="1"/>
    <circle cx="1144" cy="34" r="1.4" fill="#9AA8B7"/><circle cx="1150" cy="34" r="1.4" fill="#9AA8B7"/><circle cx="1156" cy="34" r="1.4" fill="#9AA8B7"/>
  </g>

  <text x="1900" y="33" fill="#667585" font-size="10" text-anchor="end">07 · TOOLBAR / ACTION STRIP · 1920×60</text>
</svg>
