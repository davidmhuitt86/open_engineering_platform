authority:
  authority_type: Physical Law
  authority_reference: >-
    Georg Ohm's empirical law (1827): the current through a conductor
    is directly proportional to voltage and inversely proportional to
    resistance.
  authority_source_object: null
  notes: >-
    No Source Object EKO exists yet to represent Ohm as a physical-law
    authority (SDD-R012 §7 authority.* naming convention) -- free text
    until one is authored.

evidence:
  - evidence_type: Calculation
    reference: Dimensional analysis of V = I x R against SI base units
    evidence_source_object: null
    description: Confirms unit consistency of the equation (volt = ampere x ohm).

