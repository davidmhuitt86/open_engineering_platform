# OEP Acquisition Manager -- process configuration (WORK_PACKAGE_001).
#
# Every field here has a documented default in
# include/oep/acquisition/common/config.hpp -- this file only needs to
# override what differs from a local development setup. If no config
# file is found at startup, the process runs entirely on those defaults.

[database]
host = "localhost"
port = 5432
name = "oep_acquisition"
user = "oep_acquisition"
password = ""
sslmode = "prefer"

[logging]
level = "info"
console = true
# file = "logs/oep_acquisition.log"

[storage]
root_path = "./data/vault"
workspace_path = "./data/workspace"

[server]
host = "0.0.0.0"
port = 8080
