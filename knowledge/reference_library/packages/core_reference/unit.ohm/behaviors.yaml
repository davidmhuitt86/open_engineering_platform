- behavior_id: unit.ohm.convert_prefix
  name: Convert SI Prefix
  behavior_type: Converter
  description: >-
    Converts a value expressed in ohms with one SI prefix (e.g.
    kilo-) to another (e.g. mega-).
  inputs:
    - name: value
      value_type: number
      unit_ref: unit.ohm
      unit_symbol_pending: null
      required: true
    - name: from_prefix
      value_type: string
      unit_ref: null
      unit_symbol_pending: null
      required: true
    - name: to_prefix
      value_type: string
      unit_ref: null
      unit_symbol_pending: null
      required: true
  outputs:
    - name: converted_value
      value_type: number
      unit_ref: unit.ohm
      unit_symbol_pending: null
  constraints: []
  dependencies: []
  execution_metadata:
    deterministic: true
