- behavior_id: unit.volt.convert_prefix
  name: Convert SI Prefix
  behavior_type: Converter
  description: >-
    Converts a value expressed in volts with one SI prefix (e.g.
    milli-) to another (e.g. kilo-).
  inputs:
    - name: value
      value_type: number
      unit_ref: unit.volt
      unit_symbol_pending: null
      required: true
    - name: from_prefix
      value_type: string
      unit_ref: null
      unit_symbol_pending: null
      required: true
      description: 'e.g. "milli", "kilo", "" for the base unit.'
    - name: to_prefix
      value_type: string
      unit_ref: null
      unit_symbol_pending: null
      required: true
  outputs:
    - name: converted_value
      value_type: number
      unit_ref: unit.volt
      unit_symbol_pending: null
  constraints: []
  dependencies: []
  execution_metadata:
    deterministic: true
