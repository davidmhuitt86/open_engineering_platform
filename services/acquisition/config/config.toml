# OEP Acquisition Manager -- process configuration (WORK_PACKAGE_001).
#
# Every field here has a documented default in
# include/oep/acquisition/common/config.hpp -- this file only needs to
# override what differs from a local development setup. If no config
# file is found at startup, the process runs entirely on those defaults.

[database]
host = "localhost"
port = 5432
name = "oep_acquisition"
user = "oep_acquisition"
password = "oep123"
sslmode = "prefer"

[logging]
level = "info"
console = true
# file = "logs/oep_acquisition.log"

[storage]
root_path = "./data/vault"
workspace_path = "./data/workspace"

# WP-SRV-004: host defaults to loopback-only. The supported production
# topology terminates TLS in front of this process (see
# docs/architecture/decisions/ADR-0003-OEP-REFERENCE-SERVER-TLS-BOUNDARY.md)
# and proxies to it over 127.0.0.1 -- the plaintext listener itself is not
# meant to be directly reachable from an untrusted network. Set this to
# 0.0.0.0 only for local-only development where no TLS boundary is in front
# of it and the network itself is already trusted.
[server]
host = "127.0.0.1"
port = 8080
