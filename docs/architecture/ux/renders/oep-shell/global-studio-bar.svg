<svg width="1920" height="56" viewBox="0 0 1920 56" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, -apple-system, sans-serif">
  <!-- OEP Global Studio Bar (region 02) — canonical, 1920x56 — AP-UX-005 -->
  <!-- Follows the approved reference exactly: renders/.../studio tab bar use option 3.png, "DUAL-TONE ANGLED (PREMIUM)" -->
  <!-- Dark tab body + colored angled left-edge highlight per inactive Studio; ACTIVE Studio (Diagram Studio) is solid-filled with glow border. -->
  <!-- Only correction applied: "Tools" -> "Instruments" label per AP-UX-002/AP-UX-005 §5/§6 naming decision. No other visual change. -->
  <defs>
    <linearGradient id="edge-home" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#9AA8B7"/><stop offset="100%" stop-color="#9AA8B7" stop-opacity="0"/></linearGradient>
    <linearGradient id="edge-eam" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2FB584"/><stop offset="100%" stop-color="#2FB584" stop-opacity="0"/></linearGradient>
    <linearGradient id="edge-knowledge" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#D9A441"/><stop offset="100%" stop-color="#D9A441" stop-opacity="0"/></linearGradient>
    <linearGradient id="edge-exchange" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8A5CF6"/><stop offset="100%" stop-color="#8A5CF6" stop-opacity="0"/></linearGradient>
    <linearGradient id="edge-instruments" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#D95C5C"/><stop offset="100%" stop-color="#D95C5C" stop-opacity="0"/></linearGradient>
    <linearGradient id="edge-settings" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#9AA8B7"/><stop offset="100%" stop-color="#9AA8B7" stop-opacity="0"/></linearGradient>
  </defs>

  <rect x="0" y="0" width="1920" height="56" fill="#070B10"/>
  <rect x="1" y="1" width="1918" height="1" fill="#2FD9D9" opacity="0.6"/>
  <rect x="1" y="54" width="1918" height="1" fill="#2FD9D9" opacity="0.6"/>

  <!-- Home -->
  <polygon points="16,56 176,56 208,0 48,0" fill="#0C1219" stroke="#22303C" stroke-width="1"/>
  <polygon points="16,56 76,56 108,0 48,0" fill="url(#edge-home)" opacity="0.5"/>
  <circle cx="76" cy="27" r="7" fill="none" stroke="#E7EDF4" stroke-width="1.6"/>
  <path d="M72,29 L76,24 L80,29 M73,28 V33 H79 V28" fill="none" stroke="#E7EDF4" stroke-width="1.4" stroke-linejoin="round"/>
  <text x="98" y="33" fill="#E7EDF4" font-size="13" font-weight="500">Home</text>

  <!-- Diagram Studio — ACTIVE: solid fill, glow border -->
  <polygon points="180,56 440,56 472,0 212,0" fill="#2F81F7" stroke="#8FD3FF" stroke-width="2"/>
  <circle cx="252" cy="23" r="2.8" fill="#FFFFFF"/>
  <circle cx="264" cy="31" r="2.8" fill="#FFFFFF"/>
  <circle cx="240" cy="31" r="2.8" fill="#FFFFFF"/>
  <line x1="252" y1="23" x2="264" y2="31" stroke="#FFFFFF" stroke-width="1.4"/>
  <line x1="252" y1="23" x2="240" y2="31" stroke="#FFFFFF" stroke-width="1.4"/>
  <text x="282" y="33" fill="#FFFFFF" font-size="13" font-weight="700">Diagram Studio</text>

  <!-- EAM -->
  <polygon points="444,56 584,56 616,0 456,0" fill="#0C1219" stroke="#22303C" stroke-width="1"/>
  <polygon points="444,56 504,56 536,0 476,0" fill="url(#edge-eam)" opacity="0.5"/>
  <rect x="510" y="20" width="14" height="16" rx="1.5" fill="none" stroke="#E7EDF4" stroke-width="1.4"/>
  <line x1="513" y1="25" x2="521" y2="25" stroke="#E7EDF4" stroke-width="1.1"/>
  <line x1="513" y1="29" x2="521" y2="29" stroke="#E7EDF4" stroke-width="1.1"/>
  <text x="536" y="33" fill="#E7EDF4" font-size="13" font-weight="500">EAM</text>

  <!-- Knowledge Studio -->
  <polygon points="588,56 848,56 880,0 620,0" fill="#0C1219" stroke="#22303C" stroke-width="1"/>
  <polygon points="588,56 648,56 680,0 620,0" fill="url(#edge-knowledge)" opacity="0.5"/>
  <path d="M658,21 h10 a3,3 0 0 1 3,3 v11 a3,3 0 0 0 -3,-3 h-10 z" fill="none" stroke="#E7EDF4" stroke-width="1.3"/>
  <path d="M684,21 h-10 a3,3 0 0 0 -3,3 v11 a3,3 0 0 1 3,-3 h10 z" fill="none" stroke="#E7EDF4" stroke-width="1.3"/>
  <text x="700" y="33" fill="#E7EDF4" font-size="13" font-weight="500">Knowledge Studio</text>

  <!-- Engineering Exchange -->
  <polygon points="852,56 1132,56 1164,0 884,0" fill="#0C1219" stroke="#22303C" stroke-width="1"/>
  <polygon points="852,56 912,56 944,0 884,0" fill="url(#edge-exchange)" opacity="0.5"/>
  <path d="M928,23 h16 l-5,-5 M944,23 l-5,5" fill="none" stroke="#E7EDF4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M944,32 h-16 l5,-5 M928,32 l5,5" fill="none" stroke="#E7EDF4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="966" y="33" fill="#E7EDF4" font-size="13" font-weight="500">Engineering Exchange</text>

  <!-- Instruments — AP-UX-002/AP-UX-005 §5/§6: corrected label, was "Tools" in this reference's original draft -->
  <polygon points="1136,56 1336,56 1368,0 1168,0" fill="#0C1219" stroke="#22303C" stroke-width="1"/>
  <polygon points="1136,56 1196,56 1228,0 1168,0" fill="url(#edge-instruments)" opacity="0.5"/>
  <path d="M1198,19 l12,12 -4,4 -12,-12 a4,4 0 1 1 4,-4 z" fill="none" stroke="#E7EDF4" stroke-width="1.3" stroke-linejoin="round"/>
  <text x="1224" y="33" fill="#E7EDF4" font-size="13" font-weight="500">Instruments</text>

  <!-- Settings -->
  <polygon points="1340,56 1520,56 1552,0 1372,0" fill="#0C1219" stroke="#22303C" stroke-width="1"/>
  <polygon points="1340,56 1400,56 1432,0 1372,0" fill="url(#edge-settings)" opacity="0.5"/>
  <circle cx="1410" cy="27" r="6" fill="none" stroke="#E7EDF4" stroke-width="1.4"/>
  <circle cx="1410" cy="27" r="2" fill="#E7EDF4"/>
  <g stroke="#E7EDF4" stroke-width="1.4">
    <line x1="1410" y1="18" x2="1410" y2="21"/>
    <line x1="1410" y1="33" x2="1410" y2="36"/>
    <line x1="1401" y1="27" x2="1404" y2="27"/>
    <line x1="1416" y1="27" x2="1419" y2="27"/>
  </g>
  <text x="1432" y="33" fill="#E7EDF4" font-size="13" font-weight="500">Settings</text>

  <text x="1904" y="33" fill="#667585" font-size="10" text-anchor="end">02 · GLOBAL STUDIO BAR · 1920×56</text>
</svg>
