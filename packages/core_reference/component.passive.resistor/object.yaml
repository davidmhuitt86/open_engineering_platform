ai_context:
  definition: >-
    A resistor is a passive component that limits or sets current flow
    by presenting a fixed electrical resistance, measured in ohms.
  engineering_explanation: >-
    The relationship between the voltage across a resistor and the
    current through it is linear and given by Ohm's Law (V = I x R).
    Because a resistor is passive, it can only dissipate power (as
    heat) -- it never supplies energy to the circuit. Selecting a
    resistor for a design requires matching both its resistance value
    and its power rating to the circuit's expected operating
    conditions.
  common_mistakes:
    - Ignoring power dissipation and selecting a resistor whose power
      rating is exceeded under normal operating conditions.
    - Assuming a resistor's tolerance means the nominal value is exact,
      rather than a manufacturing range around the nominal value.
    - Neglecting temperature coefficient in precision or
      high-temperature designs.
  design_considerations:
    - Resistance value and tolerance required by the circuit.
    - Power rating margin above worst-case dissipation.
    - Temperature coefficient for precision applications.
    - Package style and footprint for the target assembly process.
  troubleshooting:
    - A resistor reading far higher than its nominal value (often
      "open") frequently indicates thermal or overcurrent failure.
    - Visible discoloration or a burnt smell indicates the power
      rating was exceeded.
  frequently_asked_questions:
    - question: How is a resistor's resistance value identified?
      answer: >-
        Through-hole resistors typically use a color band code;
        surface-mount resistors typically use a printed numeric code.
        Both encode the same nominal resistance and tolerance.
    - question: Does a resistor's resistance change with temperature?
      answer: >-
        Yes. The magnitude of the change is described by the
        resistor's temperature coefficient, typically expressed in
        parts-per-million per degree Celsius.

