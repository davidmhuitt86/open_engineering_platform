# The three variables Ohm's Law relates, modeled as Engineering
# Properties of the equation itself (SDD-R011 §7).
- property_id: voltage
  display_name: Voltage
  value_type: number
  unit_ref: unit.volt
  unit_symbol_pending: null
  default_value: null
  range:
    min: null
    max: null
  constraints: []
  visibility: public
  required: true
  read_only: false
  description: Potential difference across the two points.

- property_id: current
  display_name: Current
  value_type: number
  unit_ref: null
  unit_symbol_pending: A
  default_value: null
  range:
    min: null
    max: null
  constraints: []
  visibility: public
  required: true
  read_only: false
  description: Current flowing between the two points.

- property_id: resistance
  display_name: Resistance
  value_type: number
  unit_ref: null
  unit_symbol_pending: "Ω"
  default_value: null
  range:
    min: 0
    max: null
  constraints: []
  visibility: public
  required: true
  read_only: false
  description: Resistance between the two points.
