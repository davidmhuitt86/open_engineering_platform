authority:
  authority_type: Physical Law
  authority_reference: >-
    James Prescott Joule's law of electrical power: the power
    dissipated or delivered by a circuit element equals the product
    of the voltage across it and the current through it.
  authority_source_object: null
  notes: >-
    No Source Object EKO exists yet to represent Joule as a
