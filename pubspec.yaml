name: engineering_engine
description: >
  Engineering Engine runtime for the Open Engineering Platform (OEP) —
  Engineering Graph, Symbol Library, Views, validation, navigation,
  selection, import/export, and simulation framework. Flutter/Dart,
  UI-independent.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/symbols/
