description:
  short_definition: >-
    A highly conductive elemental metal, the most widely used
    conductor material in electrical and electronic engineering.
  detailed_description: >-
    Copper is used extensively for wiring, printed circuit board
    traces, component leads, windings, and connectors due to its high
    electrical conductivity, good thermal conductivity, ductility, and
    relatively low cost compared to other high-conductivity metals such
    as silver. Its electrical resistivity increases predictably with
    temperature, described by a linear temperature coefficient over
    normal operating ranges.
  engineering_notes: >-
    Annealed copper (fully softened) is the reference standard against
    which the International Annealed Copper Standard (IACS)
    conductivity scale is defined (100% IACS). Alloying or work
    hardening copper reduces its conductivity relative to this
    reference.
  typical_applications:
    - Hookup and power wiring
    - Printed circuit board traces and planes
    - Component leads and terminations
    - Transformer and motor windings
  limitations:
    - Susceptible to oxidation without protective plating or finishing.
    - Lower conductivity than silver, though far less costly.

