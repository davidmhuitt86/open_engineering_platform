description:
  short_definition: >-
    A passive two-terminal electrical component that introduces a
    specified amount of electrical resistance into a circuit.
  detailed_description: >-
    A resistor opposes the flow of electric current, converting
    electrical energy into heat in proportion to the square of the
    current through it. Its defining electrical behavior is governed
    by Ohm's Law, which relates the voltage across the resistor to the
    current through it via its resistance value. Fixed resistors
    present a constant resistance across their rated operating range,
    distinguishing them from variable resistors (potentiometers,
    rheostats), whose resistance is intentionally adjustable.
  engineering_notes: >-
    Real resistors deviate from the ideal linear model at temperature
    extremes (temperature coefficient), at high frequency (parasitic
    inductance and capacitance become significant), and under
    excessive power dissipation (thermal derating). Preferred value
    series (e.g. E12, E24, E96) constrain the discrete resistance
    values manufacturers actually produce.
  typical_applications:
    - Current limiting
    - Voltage division
    - Pull-up and pull-down configuration for digital logic inputs
    - Bias networks for active devices
    - Precision measurement (current sensing, reference dividers)
  limitations:
    - Dissipates energy as heat; not lossless.
    - Fixed resistance value cannot be adjusted once manufactured.
    - Real components carry manufacturing tolerance and thermal drift.

